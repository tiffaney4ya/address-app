<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Address Search</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: white;
    }

    .container {
      padding: 10px;
      overflow: visible;
    }

    #autocomplete {
      width: 100%;
      height: 50px;
      font-size: 16px;
      padding: 12px;
      border: none;
      outline: none;
      box-sizing: border-box;
      border-radius: 8px;
      background: #f5f5f5;
    }

    .form {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form input {
      width: 100%;
      height: 44px;
      padding: 10px 12px;
      font-size: 14px;
      border-radius: 8px;
      border: none;
      background-color: #f5f5f5;
      box-sizing: border-box;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row input {
      width: 100%;
    }

    .pac-container {
      z-index: 999999 !important;
      position: absolute !important;
    }

    html, body {
      overflow: visible !important;
    }
  </style>
</head>

<body>
  <div class="container">
    <input id="autocomplete" type="text" placeholder="Enter address..." />

    <div class="form">
      <input id="street" placeholder="Street" readonly />
      <input id="city" placeholder="City" readonly />

      <div class="row">
        <input id="state" placeholder="State" readonly />
        <input id="zip" placeholder="Zip" readonly />
      </div>
    </div>
  </div>

  <script>
    const MAKE_WEBHOOK_URL = "YOUR_MAKE_WEBHOOK_URL";

    const params = new URLSearchParams(window.location.search);
    const rowID = params.get("rowID") || "";

    let autocomplete;

    function initAutocomplete() {
      const input = document.getElementById("autocomplete");

      autocomplete = new google.maps.places.Autocomplete(input, {
        types: ["address"],
        componentRestrictions: { country: "us" },
        fields: [
          "formatted_address",
          "address_components",
          "geometry",
          "place_id"
        ]
      });

      google.maps.event.addListener(
        autocomplete,
        "place_changed",
        handleSelection
      );
    }

    function handleSelection() {
      const place = autocomplete.getPlace();

      if (!place || !place.address_components) {
        console.error("No place data returned.");
        return;
      }

      let streetNumber = "";
      let route = "";
      let city = "";
      let state = "";
      let zip = "";
      let country = "";

      place.address_components.forEach((component) => {
        const types = component.types;

        if (types.includes("street_number")) {
          streetNumber = component.long_name;
        }

        if (types.includes("route")) {
          route = component.short_name;
        }

        if (types.includes("locality")) {
          city = component.long_name;
        }

        if (!city && types.includes("postal_town")) {
          city = component.long_name;
        }

        if (!city && types.includes("sublocality")) {
          city = component.long_name;
        }

        if (types.includes("administrative_area_level_1")) {
          state = component.short_name;
        }

        if (types.includes("postal_code")) {
          zip = component.long_name;
        }

        if (types.includes("country")) {
          country = component.long_name;
        }
      });

      const street = `${streetNumber} ${route}`.trim();
      const fullAddress = place.formatted_address || "";
      const lat = place.geometry?.location?.lat?.() || "";
      const lng = place.geometry?.location?.lng?.() || "";
      const placeId = place.place_id || "";

      document.getElementById("street").value = street;
      document.getElementById("city").value = city;
      document.getElementById("state").value = state;
      document.getElementById("zip").value = zip;

      const data = {
        rowId: rowID,
        value: {
          fullAddress,
          street,
          city,
          state,
          zip,
          country,
          placeId,
          lat,
          lng
        }
      };

      sendToMake(data);
    }

    function sendToMake(data) {
      fetch(https://hook.us2.make.com/ik5pco4zr3ybr9cmf35xlgxd57o1p8mg, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify(data)
      })
        .then(() => {
          console.log(
            "Sent to Make ✅",
            data.rowId ? `rowID: ${data.rowId}` : "(no rowID)"
          );
        })
        .catch((err) => {
          console.error("Send to Make failed ❌", err);
        });
    }

    window.onload = initAutocomplete;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBTFy2I3l2aKHHLShfTGUk7HMAoaO36pow&libraries=places&callback=initAutocomplete"
    async
    defer>
  </script>
</body>
</html>
