<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Address Search</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: white;
    }

    #autocomplete {
      width: 100%;
      height: 50px;
      font-size: 16px;
      padding: 12px;
      border: none;
      outline: none;
      box-sizing: border-box;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .container {
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: visible;
    }

    .pac-container {
      z-index: 999999 !important;
      position: absolute !important;
    }

    html, body {
      overflow: visible !important;
    }

    input[readonly] {
      background-color: #f5f5f5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div class="container">
    <input id="autocomplete" type="text" placeholder="Enter address..." />

    <div style="margin-top:10px;">
      <input id="street" placeholder="Street" style="width:100%; margin-bottom:5px;" readonly />
      <input id="city" placeholder="City" style="width:100%; margin-bottom:5px;" readonly />
      <input id="state" placeholder="State" style="width:100%; margin-bottom:5px;" readonly />
      <input id="zip" placeholder="Zip" style="width:100%;" readonly />
    </div>
  </div>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBTFy2I3l2aKHHLShfTGUk7HMAoaO36pow&libraries=places"></script>

  <script>
    let autocomplete;

    function initAutocomplete() {
      const input = document.getElementById("autocomplete");

      autocomplete = new google.maps.places.Autocomplete(input, {
        types: ["address"]
      });

      autocomplete.addListener("place_changed", function () {
        handleSelection();
      });
    }

    function handleSelection() {
      const place = autocomplete.getPlace();

      if (!place || !place.address_components) return;

      let street = "";
      let city = "";
      let state = "";
      let zip = "";
      let country = "";

      place.address_components.forEach(component => {
        const type = component.types[0];

        if (type === "street_number") {
          street = component.long_name + " " + street;
        }

        if (type === "route") {
          street += component.short_name;
