<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Address Search</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: white;
    }

    .container {
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: visible;
      padding: 10px;   /* ✅ polish */
    }

    #autocomplete {
      width: 100%;
      height: 50px;
      font-size: 16px;
      padding: 12px;
      border: none;
      outline: none;
      box-sizing: border-box;

      border-radius: 8px;
      background: #f5f5f5;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ✅ FORM LAYOUT */
    .form {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form input {
      width: 100%;
      height: 44px;
      padding: 10px 12px;
      font-size: 14px;
      border-radius: 8px;
      border: none;
      background-color: #f5f5f5;
      box-sizing: border-box;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row input {
      width: 100%;
    }

    .pac-container {
      z-index: 999999 !important;
      position: absolute !important;
    }

    html, body {
      overflow: visible !important;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- ✅ MAIN SEARCH -->
    <input id="autocomplete" type="text" placeholder="Enter address..." />

    <!-- ✅ STRUCTURED FORM -->
    <div class="form">
      <input id="street" placeholder="Street" readonly />
      <input id="city" placeholder="City" readonly />

      <div class="row">
        <input id="state" placeholder="State" readonly />
        <input id="zip" placeholder="Zip" readonly />
      </div>
    </div>

  </div>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBTFy2I3l2aKHHLShfTGUk7HMAoaO36pow&libraries=places"></script>

  <script>
    let autocomplete;

    function initAutocomplete() {
      const input = document.getElementById("autocomplete");

      autocomplete = new google.maps.places.Autocomplete(input, {
        types: ["address"]
      });

      google.maps.event.addListener(autocomplete, 'place_changed', handleSelection);
    }
    function handleSelection() {
  console.log("✅ place_changed fired");
  const place = autocomplete.getPlace();
  console.log("✅ place object:", place);

  // ... your existing code ...
}

    function handleSelection() {
      const place = autocomplete.getPlace();

      if (!place || !place.address_components) return;

      let street = "";
      let city = "";
      let state = "";
      let zip = "";
      let country = "";

      place.address_components.forEach(component => {
        const type = component.types[0];

        if (type === "street_number") {
          street = component.long_name + " " + street;
        }

        if (type === "route") {
          street += component.short_name;
        }

        if (type === "locality") {
          city = component.long_name;
        }

        if (type === "administrative_area_level_1") {
          state = component.short_name;
        }

        if (type === "postal_code") {
          zip = component.long_name;
        }

        if (type === "country") {
          country = component.long_name;
        }
      });

      /* ✅ FILL FORM */
      document.getElementById("street").value = street;
      document.getElementById("city").value = city;
      document.getElementById("state").value = state;
      document.getElementById("zip").value = zip;

      /* ✅ UX polish */
      document.getElementById("autocomplete").blur();

      /* ✅ SEND TO MAKE */
      const data = {
        fullAddress: place.formatted_address,
        street,
        city,
        state,
        zip,
        country,
        placeId: place.place_id,
        lat: place.geometry?.location?.lat(),
        lng: place.geometry?.location?.lng()
      };

      sendToMake(data);
    }

    
function sendToMake(data) {
  console.log("🔥 SENDING TO MAKE:", data);

  fetch("https://hook.us2.make.com/8tt2jrxyb36lnt90nj69ull5x43oynyh", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  })
  .then(response => {
    console.log("✅ RESPONSE:", response);
  })
  .catch(err => {
    console.error("❌ ERROR:", err);
  });
}


    window.onload = initAutocomplete;
  </script>

</body>
</html>
